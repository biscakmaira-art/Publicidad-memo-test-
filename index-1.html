<style>
:root{
  --cream:#F9F8F3; --navy:#242C50; --white:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --cream:#F9F8F3; --navy:#242C50; --white:#FFFFFF; color-scheme:light; } }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--cream);color:var(--navy);font-family:"Montserrat","Segoe UI",Arial,Helvetica,sans-serif;font-weight:700;min-height:100vh}
.page{max-width:760px;margin:0 auto;padding:clamp(24px,5vw,48px) clamp(16px,5vw,40px) clamp(20px,4vw,32px);display:flex;flex-direction:column;align-items:center;gap:clamp(16px,3.4vw,28px)}
h1{margin:0;text-align:center;font-weight:800;font-size:clamp(28px,8vw,56px);line-height:1.1;color:var(--navy)}
.board{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,3.4vw,32px);perspective:1200px}
.card{appearance:none;border:0;padding:0;margin:0;background:none;cursor:pointer;aspect-ratio:436/662;position:relative;-webkit-tap-highlight-color:transparent;touch-action:manipulation;border-radius:3.6%}
.card:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
.card:disabled{cursor:default}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s ease}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3.6%;overflow:hidden}
.face img{width:100%;height:100%;display:block;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none}
.front{transform:rotateY(180deg);box-shadow:0 2px 8px rgba(36,44,80,.22)}
.front img{object-fit:cover}
.card.found .front{box-shadow:0 0 0 3px var(--navy)}
.feedback{min-height:3.2em;margin:0;text-align:center;font-size:clamp(16px,4.2vw,24px);line-height:1.3;max-width:30ch;display:flex;align-items:center;justify-content:center;color:var(--navy)}
.feedback.win{font-weight:800;font-size:clamp(20px,5.4vw,30px)}
.restart{font:inherit;font-weight:700;font-size:clamp(13px,3.2vw,15px);letter-spacing:.1em;text-transform:uppercase;color:var(--cream);background:var(--navy);border:2px solid var(--navy);border-radius:999px;padding:12px 26px;cursor:pointer;touch-action:manipulation}
.restart:hover{background:var(--cream);color:var(--navy)}
.restart:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
.logos{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:clamp(6px,2vw,16px)}
.logos img{display:block;height:auto}
.logos .incaa{width:min(40%,290px)}
.logos .correo{width:min(36%,250px)}
@media (prefers-reduced-motion: reduce){.inner{transition:none}}
</style>
</head>

    {id:"ar-a", img:"ar", arg:true,  alt:"Afiche de Corazón de León, película argentina"},
    {id:"ar-b", img:"ar", arg:true,  alt:"Afiche de Corazón de León, película argentina"},
    {id:"gl",   img:"gl", arg:false, alt:"Afiche de El gran León"},
    {id:"fr",   img:"fr", arg:false, alt:"Afiche de Un homme à la hauteur"},
    {id:"mx",   img:"mx", arg:false, alt:"Afiche de Mi pequeño gran hombre"},
    {id:"co",   img:"co", arg:false, alt:"Afiche de Corazón de León, versión extranjera"}
  ];
  var board = document.getElementById("board");
  var fb = document.getElementById("feedback");
  var picked = [], locked = false, timer = null;

  function shuffle(a){
    a = a.slice();
    for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function say(t, win){ fb.textContent = t; fb.classList.toggle("win", !!win); }

  function build(){
    clearTimeout(timer); picked = []; locked = false;
    board.innerHTML = "";
    shuffle(DECK).forEach(function(c){
      var b = document.createElement("button");
      b.type = "button"; b.className = "card"; b.dataset.id = c.id;
      b.setAttribute("aria-label", "Carta boca abajo");
      b.innerHTML =
        '<span class="inner">' +
          '<span class="face back"><img src="'+BACK+'" alt=""></span>' +
          '<span class="face front"><img src="'+IMG[c.img]+'" alt="'+c.alt+'"></span>' +
        '</span>';
      b._card = c;
      b.addEventListener("click", function(){ onPick(b); });
      board.appendChild(b);
    });
    say("Dá vuelta las cartas y encontrá la película argentina.");
  }

  function onPick(el){
    if (locked || el.classList.contains("flipped")) return;
    el.classList.add("flipped");
    el.setAttribute("aria-label", el._card.alt);
    picked.push(el);
    if (picked.length === 1){
      say(el._card.arg ? "Esa es la posta. Ahora encontrá su par." : "Esa es una versión extranjera. Seguí buscando.");
      return;
    }
    locked = true;
    var a = picked[0], b = picked[1];
    if (a._card.arg && b._card.arg){
      a.classList.add("found"); b.classList.add("found");
      [].forEach.call(board.children, function(x){ x.disabled = true; });
      say("La posta es la argentina", true);
      picked = [];
      return;
    }
    say(a._card.arg || b._card.arg ? "Esa no es la posta. Seguí buscando." : "Dos versiones extranjeras. Seguí buscando la posta.");
    timer = setTimeout(function(){
      [a,b].forEach(function(x){ x.classList.remove("flipped"); x.setAttribute("aria-label","Carta boca abajo"); });
      picked = []; locked = false;
    }, 1100);
  }

  document.getElementById("restart").addEventListener("click", build);
  build();
})();
</script>
